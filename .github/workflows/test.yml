name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build (v2, active)
        run: forge build --sizes

      - name: Run Forge tests (v2, active)
        run: forge test -vvv --no-match-contract Fork

      - name: Run Forge build (v1, archived)
        env:
          FOUNDRY_PROFILE: v1
        run: forge build --sizes

      - name: Run Forge tests (v1, archived)
        env:
          FOUNDRY_PROFILE: v1
        run: forge test -vvv --no-match-contract Fork

      - name: Run Forge fmt
        run: forge fmt --check
