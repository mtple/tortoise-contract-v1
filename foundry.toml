[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
gas_reports = ["Tortoise", "TortoiseShell"]
fs_permissions = [{access = "read", path = "./test/fixtures"}, {access = "read", path = "./addresses"}]

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 50
fail_on_revert = false
show_metrics = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 100

[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 10000
depth = 500
fail_on_revert = false
show_metrics = true

# Archived, audited v1 (USDC) stack. Frozen — see legacy/README.md.
# Run with: forge test --profile v1
[profile.v1]
src = "legacy/v1/src"
test = "legacy/v1/test"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
gas_reports = ["TortoiseV1", "TortoiseShell"]

[profile.v1.fuzz]
runs = 1000
max_test_rejects = 65536

[profile.v1.invariant]
runs = 256
depth = 50
fail_on_revert = false
show_metrics = true

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
single_line_statement_blocks = "preserve"
